spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teamportal}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:5555}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:SuperSecretaClaveDeEjemploParaDesarrolloLocalQueSeaLarga}
  expiration: 86400000 # 24 horas en milisegundos
